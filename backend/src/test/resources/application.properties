# ── Database (H2 in-memory for tests) ──────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ── JWT (stub values sufficient for tests) ─────────────────────────────────────
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000

# ── Mail (stub — tests do not trigger email sends) ─────────────────────────────
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ── Other required properties ──────────────────────────────────────────────────
application.security.mailing.frontend.activation-url=http://localhost:3000/activate-account
application.cors.allowed-origins=http://localhost:3000
application.rate-limit.auth.max-requests=1000
application.rate-limit.auth.window-seconds=60
